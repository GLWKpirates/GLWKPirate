<!-- KPIrates LIVE build (kpirates-live.html): deploy this file to Netlify alongside
     netlify/functions/sheet.js (same folder layout as this ships in) - Netlify's build picks that
     function up automatically, no netlify.toml needed. The page itself never talks to Google
     directly: fetchSheetRows() below calls that function (same-origin, plain fetch()), and the
     function is the one thing that actually reads Google's public gviz/tq endpoint
     (docs.google.com/.../gviz/tq?tqx=out:json&sheet=...), server-side, briefly caching each sheet so
     every visitor shares one cached read instead of each browser hitting Google on its own - with a
     lot of people on the app at once, that's the difference between Google seeing a handful of
     requests a minute and seeing hundreds. It only returns real data once each spreadsheet is set to
     "Anyone with the link can view" (or published to the web) - no Google Cloud service account, no
     sign-in of any kind, same as before. The copy of this app inside Claude reads the same two
     spreadsheets through Claude's own Google Sheets connector instead (the "mcp" capability,
     window.claude.use('mcp')), which only exists in that preview pane - this file has none of that
     code, by design, since it won't run outside Claude. -->
<!-- This file needs to be served BY Netlify, with the function deployed, to show real data -
     opening it as a bare local file (file://) has nothing listening at /.netlify/functions/sheet. -->

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.45 var(--body); -webkit-text-size-adjust:100%;
  padding-block:0 100px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::after{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; background:var(--map) center / cover no-repeat}
/* Launch-screen-only background, painted on body so it reaches past the app's side padding to the
   true screen edge. Toggled by JS (render()) only while the district picker is showing - every other
   screen keeps body's normal pirate background/::after untouched. */
body.launch-bg{
  background:
    radial-gradient(900px 560px at 50% -8%, rgba(0,168,224,.32), transparent 62%),
    repeating-radial-gradient(circle at 50% 20%, rgba(0,168,224,.09) 0, rgba(0,168,224,.09) 1.5px, transparent 2.5px, transparent 42px),
    linear-gradient(180deg, #001E3C 0%, #001530 55%, #000C1C 100%);
}
body.launch-bg::after{content:none}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); background:var(--bg); z-index:10}
a{color:inherit}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.wrap{max-width:720px; margin:0 auto}
.s-good{--c:var(--good)} .s-warn{--c:var(--warn)} .s-bad{--c:var(--bad)} .s-neutral{--c:var(--neutral)}

.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:9; background:var(--bar); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px); border-bottom:2px solid var(--gold)}
.top .wrap{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:12px 10px}
.top-l{min-width:0}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--pirate); font-weight:400; font-size:clamp(19px, 6.4vw, 34px); line-height:1; letter-spacing:.01em; min-width:0}
.mark{width:28px; height:28px; flex:none; fill:none; stroke:var(--gold); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.sub{margin-top:3px; font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tools{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); flex:none}
.icon-btn{display:grid; place-items:center; width:44px; height:44px; border:1px solid var(--line); border-radius:10px; background:var(--surface); cursor:pointer}
.icon-btn svg{width:20px; height:20px}
.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{padding-block:6px 0}
.eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.sec::before{content:""; display:inline-block; width:7px; height:7px; margin-right:9px; background:var(--gold); transform:rotate(45deg); vertical-align:1px}
.sec{margin:28px 0 10px; font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.note{margin:0 0 10px; font-size:13px; color:var(--muted)}

.hero{padding-top:18px}
.big{font-family:var(--display); font-weight:800; font-size:clamp(68px, 22vw, 104px); line-height:.92; color:var(--c, var(--ink)); font-variant-numeric:tabular-nums}
.hero .bar{margin-top:14px}
.trio{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-top:16px}
.trio div{min-width:0}
.trio b{display:block; font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.trio span{font-size:12px; color:var(--muted)}

.bar{position:relative; height:8px; border-radius:4px; background:var(--line)}
.fill{display:block; height:100%; border-radius:4px; background:var(--c, var(--neutral))}
.tick{position:absolute; top:-3px; bottom:-3px; width:1px; background:var(--ink); opacity:.3}
.tick.t100{width:2px; opacity:.75}
.chest{width:22px; height:22px; flex:none; fill:color-mix(in srgb, var(--gold) 24%, transparent); stroke:var(--gold); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; vertical-align:-5px}
.lbl .chest, .eyebrow .chest, .dh .chest{margin-right:6px}
.pct .chest{margin-right:8px; vertical-align:-3px}

/* The 4 preview districts' own dashboard theme - the same AT&T blue/navy palette, signal-ring
   background and Barlow Condensed display font as the launch page, instead of the pirate parchment
   look Cincinnati still uses. Toggled on <body> (alongside launch-bg) only while a mock district's
   page is showing, so nothing about Cincinnati changes. Because every component below already reads
   its colors from these same custom properties, redefining them here re-skins the whole dashboard -
   bars, pills, chests, nav, headers - without touching any of those rules. */
body.theme-mock{
  --ink:#F4F9FD; --muted:#8FA9C4; --line:rgba(255,255,255,.16);
  --accent:#00A8E0; --accent-ink:#001E3C; --gold:#00A8E0; --gold-ink:#001E3C;
  --card:rgba(12,42,72,.72); --bar:rgba(0,21,48,.88); --bg:#001E3C; --surface:#0B2A4A;
  --pirate:'Barlow Condensed',var(--display);
  background:
    radial-gradient(900px 560px at 50% -8%, rgba(0,168,224,.32), transparent 62%),
    repeating-radial-gradient(circle at 50% 20%, rgba(0,168,224,.09) 0, rgba(0,168,224,.09) 1.5px, transparent 2.5px, transparent 42px),
    linear-gradient(180deg, #001E3C 0%, #001530 55%, #000C1C 100%);
  background-attachment:fixed;
}
body.theme-mock::after{content:none}
body.theme-mock::before{background:var(--bg)}

/* Command Center (Market Director's all-districts roll-up) theme - its own dark "chart room" look,
   distinct from both Cincinnati's pirate parchment and the other 4 districts' AT&T blue, since Kris
   Keith oversees all of them rather than belonging to any one district's own branding. A fine amber
   grid stands in for a map table/console readout; brass/gold accents tie back to var(--gold)'s role
   everywhere else in the app. Only applied while state.district === 'control-center'. */
body.theme-command{
  --ink:#F4E9D8; --muted:#A99C86; --line:rgba(217,164,65,.22);
  --accent:#D9A441; --accent-ink:#1A1410; --gold:#D9A441; --gold-ink:#1A1410;

  --pirate:'Big Shoulders Display',var(--display);
  background:
    radial-gradient(900px 560px at 50% -8%, rgba(217,164,65,.22), transparent 62%),
    repeating-linear-gradient(0deg, rgba(217,164,65,.05) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, rgba(217,164,65,.05) 0 1px, transparent 1px 44px),
    linear-gradient(180deg, #10151A 0%, #0B0E12 60%, #07090B 100%);
  background-attachment:fixed;
}
body.theme-command::after{content:none}
body.theme-command::before{background:var(--bg)}

  /* ---------- helpers ---------- */
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var num = function(s){ if (s == null) return NaN; var t = String(s).replace(/[$,%\s]/g, ''); return t === '' ? NaN : parseFloat(t); };
  var clean = function(s){ return String(s || '').replace(/^[^\p{L}\p{N}$#]+/u, '').replace(/\s+/g, ' ').trim(); };
  var titleCase = function(s){ return String(s).toLowerCase().replace(/\b[a-z]/g, function(c){ return c.toUpperCase(); }); };
  var fmt = function(s){ s = String(s == null ? '' : s).trim(); return /^-?\d+\.0+$/.test(s) ? s.replace(/\.0+$/, '') : s; };
  var short = function(s){ s = fmt(s); var n = num(s); if (s.charAt(0) === '$' && n >= 1000) return '$' + Math.round(n).toLocaleString('en-US'); return s; };
  function nameParts(t){
    var m = /^([A-Z]{2})\s+(.*?)\s*(#\d+)?$/.exec(String(t).trim());
    if (!m) return { st:'', name: titleCase(t), id:'' };
    return { st: m[1], name: titleCase(m[2]), id: m[3] || '' };
  }
  function status(k){
    var g = String(k && k.paid || '');
    if (g.indexOf('\u{1F622}') >= 0) return 'bad';
    if (g.indexOf('⚠') >= 0) return 'warn';
    if (g.trim()) return 'good';
    return 'neutral';
  }
  var PILL = { bad: 'Not paid yet', warn: 'Close', good: 'Paid' };
  var MAXP = 120;
  function bar(p, cls){
    var w = isNaN(p) ? 0 : Math.max(0, Math.min(p, MAXP)) / MAXP * 100;
    return '<div class="bar s-' + cls + '"><i class="fill" style="width:' + w.toFixed(1) + '%"></i>' +
      '<b class="tick" style="left:' + (90/MAXP*100).toFixed(2) + '%"></b>' +
      '<b class="tick t100" style="left:' + (100/MAXP*100).toFixed(2) + '%"></b>' +

  /* ---------- parsers ---------- */
  // Display-name overrides: the workbook keeps a manager's full/legal name, but the app shows
  // whatever name they actually go by. Keyed by the exact text the sheet's "Manager:" line has.
  var NICKNAMES = { 'William Howell': 'Mike Howell' };
  function parseCard(v){
    if (!v) return null;
    var cell = function(r, c){ return v[r] && v[r][c] != null ? String(v[r][c]) : ''; };
    var out = { title: clean(cell(0,0).split('|')[0]), full: cell(0,0), manager:'', kpis:[], needs:[], days:null };
    var m = /Manager:\s*([^|]+)/i.exec(cell(1,0)); if (m) out.manager = NICKNAMES[m[1].trim()] || m[1].trim();
    var mode = '';
    v.forEach(function(r){
      r = r || [];
      var a = String(r[0] == null ? '' : r[0]).trim();
      if (a === 'KPI METRIC') { mode = 'kpi'; return; }
      if (a === 'KPI') { mode = 'need'; return; }
      if (/Days Remaining/i.test(a)) { out.days = num(r[2]); mode = ''; return; }
      if (/DAILY NEEDS/i.test(a)) { mode = ''; return; }
      if (!a) { if (mode === 'need' && out.needs.length) mode = ''; return; }
      if (mode === 'kpi') {
        var raw = clean(a), note = '', pm = /^(.*?)\s*\((.*)\)\s*$/.exec(raw);
        if (pm) { raw = pm[1]; note = pm[2]; }
        out.kpis.push({ label: raw, note: note, target: r[2], actual: r[5], pct: r[7], paid: r[8] || '' });
      } else if (mode === 'need') {
        out.needs.push({ label: clean(a), tiers: [90,100,110,120].map(function(p, i){ return { pct: p, val: r[i+1] }; }), rt: r[5], gap: r[7] });
      }
    });
    return out;
  }
  function parseBelt(v){
    if (!v) return null;
    var rows = [], i = 1;
    for (; i < v.length; i++) {
      var r = v[i] || [];
      var a = String(r[0] == null ? '' : r[0]).trim();
      // A real store row always has a Voice % value in column B too. The weighting-explanation lines
      // ("Weighted as follows:", "Voice % is worth 35% of Top Store Score", ...) only fill column A,
      // so checking column B as well catches tabs where no blank spacer row separates the store list
      // from those notes (KPOD Goats' tab has none) - relying on a blank row alone missed those and
      // let the explanation text get counted as two extra "stores".
      var hasVoice = r[1] != null && String(r[1]).trim() !== '';
      if (!a || !hasVoice) break;
      rows.push({ name: clean(r[0]), voice: r[1], upgrade: r[2], internet: r[3], revenue: r[4], score: r[5] });
    }
    var notes = v.slice(i).map(function(r){ return String((r && r[0]) || '').trim(); }).filter(function(t){ return /worth/i.test(t); });
    return { rows: rows, notes: notes };
  }
  function parseTop3(v){
    if (!v) return null;
    var cats = [];
    for (var i = 0; i < v.length; i++) {
      var r = v[i] || [];
      if (String(r[0] == null ? '' : r[0]).indexOf('Top 3') === 0) {
        for (var c = 0; c < r.length; c++) {
          if (!r[c]) continue;
          var ents = [];
          for (var k = 1; k <= 3; k++) {

            var m = /^\S+\s+(.*?)\s*\(([^)]*)\)\s*$/.exec(s);
            if (m) ents.push({ name: m[1], val: m[2] });
          }

        }

  function splitCell(x){ var p = String(x == null ? '' : x).split(' / '); return { a: p[0] || '', n: p.length > 1 ? p[1] : '' }; }
  function parseDaily(v){
    if (!v) return null;
    var tiers = [], cur = null;
    v.forEach(function(r){
      r = r || [];
      var a = String(r[0] == null ? '' : r[0]).trim();
      var m = /^NEED FOR\s+(\d+)%/i.exec(a);
      if (m) { cur = { pct: +m[1], cols: r.slice(1).map(function(x){ return String(x || '').trim(); }), kpis: [] }; tiers.push(cur); return; }
      if (!a) { cur = null; return; }

  // function's own response has header = ["Location","ManagerName","","","","",...] - every column

  var RT_HEADER = ['Location','ManagerName','Total Close Rate','Total Opps','Guests','Total Rev - Estimate',

  function totalKpi(c){ return c && c.kpis.filter(function(k){ return /^total revenue/i.test(k.label); })[0]; }

  /* ---------- views ---------- */
  var FLOOR = [['Total Opps','Opportunities','count'],['Guests','Guests in','count'],['Total Rev - Estimate','Revenue so far','money'],

  function closeRates(rt){
    /* The sheet leaves these blank on the district total row, so they are worked out from its counts.
       All four CRs follow the same pattern districts report: category count / Guests. */
    var items = [
      { k: 'Total CR',   raw: 'Total Close Rate', num: 'Total Opps', den: 'Guests', unit: 'guests' },
      { k: 'PPV CR',     raw: 'PPV CR',           num: 'PPV',        den: 'Guests', unit: 'guests' },
      { k: 'AIA CR',     raw: 'AIA Close Rate',   num: 'AIA Submits', den: 'Guests', unit: 'guests' },
      { k: 'Upgrade CR', raw: 'UP CR',            num: 'Data',       den: 'Guests', unit: 'guests' }
    ].map(function(i){
      var rawV = String((rt && rt[i.raw]) == null ? '' : rt[i.raw]).trim();
      var n = fmt(rt && rt[i.num]) || '0', d = fmt(rt && rt[i.den]) || '0';
      var v = rawV || ratio(rt && rt[i.num], rt && rt[i.den]) || '0%';
      return { k: i.k, v: v, sub: n + ' of ' + d + ' ' + i.unit };
    });
    return '<h2 class="sec">Close rates</h2><div class="crs">' + items.map(function(i){
      return '<div><span>' + esc(i.k) + '</span><b>' + esc(i.v) + '</b><small>' + esc(i.sub) + '</small></div>';
    }).join('') + '</div>';
  }

  function floorPanel(rt){
    var items = FLOOR;
    return '<h2 class="sec">On the floor today</h2><div class="floor">' +
      items.map(function(f){
        var raw = rt && rt[f[0]];
        var has = raw != null && String(raw).trim() !== '';
        return '<div><span>' + esc(f[1]) + '</span><b>' + esc(has ? fmt(raw) : floorDefault(f[2])) + '</b></div>';
      }).join('') + '</div>';
  }

  function needCard(n){
    var rt = num(n.rt), next = -1;
    var chips = n.tiers.filter(function(t){ return t.pct !== 110; }).map(function(t, i){
      var need = num(t.val), met = !isNaN(rt) && !isNaN(need) && rt >= need;
      if (!met && next < 0) next = i;
      return { t: t, met: met };
    });
    var g = String(n.gap == null ? '' : n.gap).trim(), gv = num(g), gtxt = '';
    if (!isNaN(gv)) gtxt = gv < 0 ? esc(g.replace(/^-/, '')) + ' short of 120%' : 'Past 120%';
    var dayMet = chips.some(function(c){ return c.t.pct === 90 && c.met; });
    return '<div class="row"><div class="row-h"><span class="lbl">' + (dayMet ? CHEST : '') + esc(n.label) + '</span><span class="today">Today ' + esc(fmt(n.rt)) + '</span></div>' +
      '<div class="tiers">' + chips.map(function(c, i){
        return '<div class="tier' + (c.met ? ' met' : '') + (i === next ? ' next' : '') + '"><small>' + (c.met ? '✓ ' : '') + c.t.pct + '%</small><b>' + esc(short(c.t.val)) + '</b></div>';
      }).join('') + '</div>' + (gtxt ? '<div class="row-f"><span>' + gtxt + '</span></div>' : '') + '</div>';
  }

  function scorecard(c, rt){
    var tot = totalKpi(c), body = '';
    if (tot) {
      var st = status(tot), p = num(tot.pct);
      body += '<section class="hero s-' + st + '"><div class="eyebrow">' + (p >= 90 ? CHEST : '') + 'Total revenue to goal' + (p >= 90 ? ' · 90%+ reached' : '') + '</div><div class="big">' + esc(tot.pct) + '</div>' + bar(p, st) +
        '<div class="scale" aria-hidden="true"><span style="left:75%">90</span><span style="left:83.33%">100</span><span style="left:91.67%">110</span><span style="left:100%">120</span></div>' +
        '<div class="trio"><div><b>' + esc(fmt(tot.actual)) + '</b><span>Month to date</span></div><div><b>' + esc(fmt(tot.target)) + '</b><span>Target</span></div>' +
        '<div><b>' + (c.days == null || isNaN(c.days) ? '—' : esc(c.days)) + '</b><span>Days left</span></div></div></section>';
    }
    body += closeRates(rt);
    var rest = c.kpis.filter(function(k){ return k !== tot; });
    if (rest.length) {
      body += '<h2 class="sec">Month to date</h2><div class="list">' + rest.map(function(k){
        var s = status(k), p = num(k.pct);
        return '<div class="row s-' + s + '"><div class="row-h"><span class="lbl">' + esc(k.label) + (k.note ? '<small>' + esc(k.note) + '</small>' : '') + '</span><span class="pct">' + (p >= 90 ? CHEST : '') + esc(k.pct) + '</span></div>' +
          bar(p, s) + '<div class="row-f"><span>' + esc(fmt(k.actual)) + ' of ' + esc(fmt(k.target)) + '</span>' + (k.paid ? '<span class="pill">' + (PILL[s] || esc(k.paid)) + '</span>' : '') + '</div></div>';
      }).join('') + '</div>';
    }
    if (c.needs.length) {
      body += '<h2 class="sec">Daily needs</h2><p class="note">What today has to reach to land each pay tier. Today’s number so far is on the right.</p><div class="list">' + c.needs.map(needCard).join('') + '</div>';
    }
    return body + floorPanel(rt);
  }

  function skeleton(){ return '<div class="sk tall"></div><div class="sk"></div><div class="sk"></div><div class="sk tall"></div><div class="sk"></div>'; }
  function sectionMissing(key){
    var e = errors[key];
    if (e) return '<div class="notice"><h2>This tab didn’t load</h2><p>Google Sheets did not return it just now. It will try again on the next refresh.</p><button class="btn" data-act="refresh">Refresh</button></div>';
    return skeleton();
  }

  function viewNeeds(){
    var tiers = dailyFor();
    if (!tiers) return sectionMissing('daily');
    tiers = tiers.filter(function(t){ return t.pct !== 110; });
    if (!tiers.length) return '<div class="notice"><h2>No daily needs yet</h2><p>The daily needs tab has no tiers to show.</p></div>';
    if (state.tier === 110) state.tier = 100;
    var cur = tiers.filter(function(t){ return t.pct === state.tier; })[0] || tiers[Math.min(1, tiers.length - 1)];
    var out = '<h2 class="sec">Daily needs by store</h2><div class="seg" role="group" aria-label="Pay tier">' + tiers.map(function(t){
      return '<button type="button" data-tier="' + t.pct + '" aria-pressed="' + (t.pct === cur.pct) + '">' + t.pct + '%</button>';
    }).join('') + '</div><p class="note" style="margin-top:12px">Each store’s metrics against what today needs to reach ' + cur.pct + '%. A chest means the 90% need for today is already reached.</p>';
    var t90 = tiers.filter(function(t){ return t.pct === 90; })[0];
    function need90(label, i){
      if (!t90) return null;
      var k = t90.kpis.filter(function(x){ return x.label === label; })[0], c = k && k.cells[i];
      return c && c.n !== '' ? num(c.n) : null;
    }
    function hit90(r){ return r.n90 != null && !isNaN(r.n90) && (r.n90 <= 0 || num(r.cl.a) >= r.n90); }
    var groups = cur.cols.map(function(nm, i){
      return { name: nm, dist: i === 0, rows: cur.kpis.map(function(k){ return { label: k.label, cl: k.cells[i] || { a: '', n: '' }, n90: need90(k.label, i) }; }) };
    });
    out += groups.map(function(g){
      var met = g.rows.filter(function(r){ var n = num(r.cl.n), a = num(r.cl.a); return r.cl.n !== '' && (n <= 0 || a >= n); }).length;
      return '<div class="dgroup' + (g.dist ? ' dist' : '') + '"><div class="list"><div class="dh"><span>' + (g.rows.length && g.rows.every(hit90) ? CHEST : '') + esc(g.dist ? 'District total' : titleCase(g.name)) + '</span><span class="m">' + met + ' of ' + g.rows.length + ' met</span></div>' +
        g.rows.map(function(r){
          var cl = r.cl, a = num(cl.a), n = num(cl.n), done = cl.n !== '' && (n <= 0 || a >= n);
          var p = done ? 100 : (n > 0 && !isNaN(a) ? a / n * 100 : 0);
          return '<div class="drow"><span>' + (hit90(r) ? CHEST : '') + esc(r.label) + '</span><span>' +
            (done ? '<span class="done">✓ Met</span> · ' + esc(fmt(cl.a)) : esc(fmt(cl.a)) + ' / ' + esc(short(cl.n))) + '</span>' +
            '<div class="bar s-' + (done ? 'good' : (p >= 50 ? 'warn' : 'bad')) + '"><i class="fill" style="width:' + Math.max(0, Math.min(100, p)).toFixed(0) + '%"></i></div></div>';
        }).join('') + '</div></div>';
    }).join('');
    return out;
  }

  /* ---------- CE Scorecard ---------- */
  function pct1(raw){
    var s = String(raw == null ? '' : raw).trim();
    if (s === '') return '—';
    var n = num(s);
    if (isNaN(n)) return esc(s);
    return (n * 100).toFixed(1) + '%';
  }
  function parseCEScore(v){
    if (!v || v.length < 2) return [];
    var header = v[0], out = [];
    for (var i = 1; i < v.length; i++) {
      var r = v[i] || [];
      var name = String(r[0] || '').trim();
      if (!name) continue;
      if (name.toUpperCase() === 'X') continue;   // no longer with the company
      var store = String(r[1] || '').trim();
      var stats = [];
      for (var c = 3; c < header.length; c++) {
        var label = String(header[c] || '').replace(/\s+/g, ' ').trim();
        if (!label) continue;
        stats.push({ label: label, raw: r[c] });
      }
      out.push({ name: name, store: store, stats: stats });
    }
    return out;
  }
  function cescGroup(rows){
    var groups = {};
    rows.forEach(function(r){ (groups[r.store] = groups[r.store] || []).push(r); });
    return groups;
  }
  function cescOrderedStores(groups, explicitOrder){
    if (explicitOrder) return explicitOrder.filter(function(s){ return groups[s]; });
    var known = Object.keys(CESCORE_STORE).filter(function(s){ return groups[s]; });
    var extra = Object.keys(groups).filter(function(s){ return CESCORE_STORE[s] == null; }).sort();
    return known.concat(extra);
  }
  // stats[0] is always Summit Scorecard (the composite score, shown as the headline); the rest are
  // grouped under the category each column belongs to, with a short chip label instead of the full
  // column header, since the group title already gives that context.
  var CESC_GROUPS = [
    { title: 'New Voice', items: [[1, 'To Goal'], [2, 'Points']] },
    { title: 'Data / Upgrade', items: [[3, 'To Goal'], [4, 'Points']] },
    { title: 'Accessories', items: [[5, 'To Goal'], [6, 'Points']] },
    { title: 'Internet', items: [[7, 'To Goal'], [8, 'Submitted'], [9, 'Points']] },
    { title: 'CRU / FN', items: [[10, 'To Goal'], [11, 'Points']] },
    { title: 'Quality', items: [[12, 'Personal'], [13, 'Points'], [14, 'Location']] }
  ];
  function cescStatBlock(e){
    var head = e.stats[0], hp = num(head ? head.raw : '') * 100;
    var cls = isNaN(hp) ? 'neutral' : (hp >= 100 ? 'good' : hp >= 80 ? 'warn' : 'bad');
    var open = !!state.cescOpen[e.name];
    var detail = '';
    if (open) {
      detail = '<div class="stat-grp">' + CESC_GROUPS.map(function(g){
        var items = g.items.filter(function(it){ return e.stats[it[0]]; });
        if (!items.length) return '';
        return '<div><h4>' + esc(g.title) + '</h4><div class="stat-chips" style="grid-template-columns:repeat(' + items.length + ',minmax(0,1fr))">' +
          items.map(function(it){ return '<div class="stat-chip"><span>' + esc(it[1]) + '</span><b>' + pct1(e.stats[it[0]].raw) + '</b></div>'; }).join('') +
        '</div></div>';
      }).join('') + '</div>';
    }
    return '<a class="row s-' + cls + ' emprow" href="javascript:void(0)" data-act="toggle-emp" data-emp="' + esc(e.name) + '">' +
      '<div class="row-h"><span class="lbl">' + esc(e.name) + '</span><span class="pct">' + (head ? pct1(head.raw) : '—') + '</span></div>' +
      bar(isNaN(hp) ? 0 : hp, cls) + detail + '</a>';
  }

  /* ---------- Daily Ops Review: live read + per-district filter, see DOR_SID/DOR_TABS above ---------- */
  function opsRowsFor(key){ return data['dor:' + key] || null; }
  // Splits a raw ops tab's rows into {header, rows}, filtering out any row whose district-column
  // value doesn't match the current district - unless the tab has no district column at all
  // (distCol -1), or the cell is blank (a subtotal/grand-total row, left alone rather than guessed
  // at, same rule KPIratesDailyOpsWatcher.gs used to apply server-side before this moved client-side).
  function opsFilteredRows(def, distKey){
    distKey = distKey || state.district;
    var raw = opsRowsFor(def.key);
    if (!raw) return null;
    var header = raw[def.headerRow] || [];
    var body = raw.slice(def.headerRow + 1);
    // 'market' is the Command Center's explicit request for every row, company-wide, unfiltered -
    // distinct from a falsy distKey (which falls back to state.district above, the per-district page).
    if (distKey === 'market') return { header: header, rows: body, filtered: false };
    if (def.fuzzyCols) {
      var kws = DOR_FUZZY_KEYWORDS[distKey] || [];
      var frows = body.filter(function(r){
        return def.fuzzyCols.some(function(c){
          var text = String(r[c] == null ? '' : r[c]).toUpperCase();
          return kws.some(function(k){ return text.indexOf(k) !== -1; });
        });
      });
      return { header: header, rows: frows, filtered: true };
    }
    if (def.distCol < 0) return { header: header, rows: body, filtered: false };
    var pat = DOR_DISTRICT_PATTERN[distKey];
    var rows = body.filter(function(r){
      var v = String(r[def.distCol] == null ? '' : r[def.distCol]).trim();
      if (!v) return !def.dropBlankDist;   // a blank district cell is a subtotal/grand-total row -
                                            // kept by default (we can't tell whose row it is), but
                                            // dropped when a tab says so explicitly (e.g. Comp Offsets'
                                            // own company-wide total row underneath its district rows).
      return !pat || pat.test(v);
    });
    return { header: header, rows: rows, filtered: true };
  }
  function opsCell(v){ return '<td>' + esc(v == null ? '' : v) + '</td>'; }
  // Closing Checklist's date columns: anything that literally says "NO" (checklist not done) renders
  // as a red X; everything else in a date column - "done" markers, or simply blank because the store
  // hasn't reported yet - renders as a green check, per how this tab is meant to be read: NO is the
  // only value that flags a problem. The ID columns (OpusID/District/Name) before idCols are left as
  // plain text, never turned into a check/X.
  function checklistCellFn(idCols){
    return function(v, i){
      if (i < idCols) return opsCell(v);
      var s = String(v == null ? '' : v).trim().toUpperCase();
      if (s === 'NO') return '<td class="chk chk-no" title="NO">✗</td>';
      return '<td class="chk chk-yes"' + (s ? ' title="' + esc(v) + '"' : '') + '>✓</td>';
    };
  }
  // Daily Device Scans' date columns use their own 3-value vocabulary instead of Closing Checklist's
  // NO/not-NO one: "No Count" is a red X, "Counted" a green check, "Cancelled" a yellow caution sign.
  // Anything else (blank, or a value that isn't one of these three) is left as plain text rather than
  // guessed at, since only these three were asked for.
  function deviceScanCellFn(idCols){
    return function(v, i){
      if (i < idCols) return opsCell(v);
      var s = String(v == null ? '' : v).trim().toUpperCase();
      if (s === 'NO COUNT') return '<td class="chk chk-no" title="No Count">✗</td>';
      if (s === 'COUNTED') return '<td class="chk chk-yes" title="Counted">✓</td>';
      if (s === 'CANCELLED' || s === 'CANCELED') return '<td class="chk chk-warn" title="Cancelled">⚠</td>';
      return opsCell(v);
    };
  }
  // Count Completion keeps the original wording in the cell (unlike the two above, which replace the
  // text outright) and just prefixes it with a matching icon: ✓ for "Yes", ✗ for "No - No Count", ⚠
  // for "No - Adjustment Error". Anything else is left as plain text.
  function countCompletionCellFn(idCols){
    return function(v, i){
      if (i < idCols) return opsCell(v);
      var s = String(v == null ? '' : v).trim(), su = s.toUpperCase();
      if (su === 'YES') return '<td><b class="chk chk-yes">✓</b> ' + esc(s) + '</td>';
      if (su === 'NO - NO COUNT') return '<td><b class="chk chk-no">✗</b> ' + esc(s) + '</td>';
      if (su === 'NO - ADJUSTMENT ERROR') return '<td><b class="chk chk-warn">⚠</b> ' + esc(s) + '</td>';
      return opsCell(v);
    };
  }
  // Merch Audit's "Audit Result" column (a percentage, e.g. "70%") only - every other column
  // (District, Location, Dealer Code, Audit Count, Reaudit Required, dates) stays plain text. 100%
  // gets a moneybag, 90% or more a green check, under 90% a red X - the original percentage text
  // is kept either way, just prefixed with the icon.
  function merchAuditCellFn(resultCol){
    return function(v, i){
      if (i !== resultCol) return opsCell(v);
      var s = String(v == null ? '' : v).trim();
      var pct = parseFloat(s.replace('%', ''));
      if (isNaN(pct)) return opsCell(v);
      if (pct >= 100) return '<td><b class="chk chk-money" title="100%">💰</b> ' + esc(s) + '</td>';
      if (pct >= 90) return '<td><b class="chk chk-yes" title="90% or more">✓</b> ' + esc(s) + '</td>';
      return '<td><b class="chk chk-no" title="Under 90%">✗</b> ' + esc(s) + '</td>';
    };
  }
  function cellFnFor(rule){
    if (!rule) return null;
    if (rule.mode === 'deviceScan') return deviceScanCellFn(rule.idCols);
    if (rule.mode === 'countCompletion') return countCompletionCellFn(rule.idCols);
    if (rule.mode === 'merchAuditResult') return merchAuditCellFn(rule.resultCol);
    return checklistCellFn(rule.idCols);
  }
  function opsTableHtml(header, rows, cellFn){
    var cols = header.length || Math.max.apply(null, rows.map(function(row){ return row.length; }));
    cellFn = cellFn || opsCell;
    return '<div class="opstable-wrap"><table class="opstable"><thead><tr>' +
      header.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' +
      rows.map(function(row){
        var cells = [];
        for (var i = 0; i < cols; i++) cells.push(cellFn(row[i], i));
        return '<tr>' + cells.join('') + '</tr>';
      }).join('') +
      '</tbody></table></div>';
  }
  // Comp Offsets has a SECOND table beneath the district-totals one - a per-employee breakdown with
  // no District column of its own, just each employee's HomeStore. Found by scanning for whichever
  // row's first cell says "Employee" (its own header), then filtered by matching that HomeStore
  // against the current district's own store roster (DOR_DISTRICT_STORES) instead of a district match.
  function opsEmployeeTable(raw, distKey){
    var hi = -1;
    for (var i = 0; i < raw.length; i++) { if (/employee/i.test(String((raw[i] || [])[0] || ''))) { hi = i; break; } }
    if (hi < 0) return '';
    var header = raw[hi], body = raw.slice(hi + 1);
    distKey = distKey || state.district;
    var rows = distKey === 'market' ? body : body.filter(function(r){
      var stores = DOR_DISTRICT_STORES[distKey] || [];
      return stores.indexOf(String(r[1] == null ? '' : r[1]).trim()) !== -1;
    });
    if (!rows.length) return '';
    return '<p class="note" style="margin:10px 0 0">By employee</p>' + opsTableHtml(header, rows);
  }
  // Keeps the first idCols columns (OpusID/District/Name etc.) plus only the LAST `days` date
  // columns (dates run left-to-right, oldest to newest, so "most recent" = rightmost) instead of
  // every date the report has ever carried - used for Daily Device Scans and Closing Checklist,
  // which otherwise grow a new column per day and get unreadably wide.
  function trimRecentDateCols(header, rows, idCols, days){
    var total = header.length, keep = [];

  function districtCardKey(dk){ return dk === 'cincinnati' ? 'district' : dk + '::district'; }

  // The sheet's own "% TO GOAL" column is not a plain actual/full-month-target ratio - it's paced
  // against how far into the month you are (Cincinnati's Total Revenue is actual $44,623 against a
  // $248,985 full-month target, 17.9% of it, but the sheet's own % to goal reads 67.21%). Summing raw
  // actual and raw target across districts and dividing would silently produce a different, smaller
  // number than "% to goal" means anywhere else in this app - closer to a flat close-rate-style ratio
  // than an MTD pace figure. Instead, back out each district's own implied *paced* target from the two
  // numbers the sheet already gives us (actual and its own % to goal: target = actual / (pct/100)),
  // then sum actual and that implied paced target across districts and divide. That reproduces the
  // exact same "% to goal" definition each district's own page already uses, just pooled market-wide.
  function impliedPacedTarget(actual, pct){
    var a = num(actual), p = num(pct);
    if (isNaN(a) || isNaN(p) || p === 0) return NaN;
    return a / (p / 100);
  }
  function marketKpiPct(entries, label){
    var sumA = 0, sumT = 0, have = false;
    entries.forEach(function(x){
      if (!x.c) return;
      var k = x.c.kpis.filter(function(k2){ return k2.label === label; })[0];
      if (!k) return;
      var a = num(k.actual), it = impliedPacedTarget(k.actual, k.pct);
      if (!isNaN(a) && !isNaN(it) && it > 0) { sumA += a; sumT += it; have = true; }
    });
    return have && sumT > 0 ? (sumA / sumT * 100) : NaN;
  }
  // Builds an rt-shaped object (same key names RealTime_Data's header row uses, the ones closeRates()/
  // floorPanel() already read) by summing RealTime_Data's raw store rows directly, instead of trusting
  // a text match against a single "Grand Total" (or per-district total) row/title. Pass a store-name
  // array to total just that district (DOR_DISTRICT_STORES[key]), or null/undefined to total every
  // store company-wide. This is what Close rates/On the floor fall back to whenever the row-title
  // lookup comes up empty, so a mismatched or missing total-row label can never zero out numbers that
  // the raw per-store data clearly has.
  function rtTotalsForStores(stores){
    var rt = data.rt || [];
    if (!rt.length) return null;
    var header = RT_HEADER; // never the live header row - see RT_HEADER's own comment for why
    var rows = rt.slice(1).filter(function(r){
      var loc = String((r && r[0]) || '').trim();
      if (!loc || /^grand total$/i.test(loc)) return false;
      return !stores || stores.indexOf(loc) !== -1;
    });
    function idx(name){ return header.indexOf(name); }
    function sum(name){
      var i = idx(name);
      if (i < 0) return 0;
      return rows.reduce(function(s, r){ var n = num(r[i]); return s + (isNaN(n) ? 0 : n); }, 0);
    }
    var opps = sum('Total Opps'), guests = sum('Guests'), ppv = sum('PPV'), ups = sum('Data'),
        aiaSub = sum('AIA Submits'), rev = sum('Total Rev - Estimate'), accRev = sum('Acc Rev'), htp = sum('HTP');
    return {
      'Total Close Rate': ratio(opps, guests), 'Total Opps': String(opps), 'Guests': String(guests),
      'PPV CR': ratio(ppv, guests), 'PPV': String(ppv),
      'AIA Close Rate': ratio(aiaSub, guests), 'AIA Submits': String(aiaSub),
      'UP CR': ratio(ups, guests), 'Data': String(ups),
      'Total Rev - Estimate': '$' + rev.toFixed(2),
      'Rev/Guest': guests > 0 ? '$' + (rev / guests).toFixed(2) : '$0.00',
      'Acc Rev': '$' + accRev.toFixed(2), 'HTP': String(htp)
    };
  }
  // Sums RealTime_Data's own additive columns (Total Opps, Guests, revenue, PPV, Ups, AIA counts,
  // Acc Rev, HTP) across one district's own stores (DOR_DISTRICT_STORES - the same exact-name roster
  // already used to filter the Daily Ops Review report per district), then derives every ratio stat
  // (Total CR, PPV CR, AIA CR, Rev/Guest, Upgrade CR) from those sums with the same ratio()-of-sums
  // approach the Grand Total row's own Close rates already use - never by averaging each store's own
  // percentage, which would be the wrong math. Upgrade CR is computed as Ups ÷ Total Opps (RealTime_
  // Data's own "Ups" count column), matching how Total CR and PPV CR are both "a count ÷ Guests" -
  // flag it if that's not how your team defines it and I'll change the formula.
  function districtRtSums(d){
    var rt = data.rt || [];
    var header = RT_HEADER; // never the live header row - see RT_HEADER's own comment for why
    var stores = DOR_DISTRICT_STORES[d.key] || [];
    var rows = rt.slice(1).filter(function(r){ return stores.indexOf(String((r && r[0]) || '').trim()) !== -1; });
    function idx(name){ return header.indexOf(name); }
    function sum(name){
      var i = idx(name);
      if (i < 0) return 0;
      return rows.reduce(function(s, r){ var n = num(r[i]); return s + (isNaN(n) ? 0 : n); }, 0);
    }
    return {
      opps: sum('Total Opps'), guests: sum('Guests'), rev: sum('Total Rev - Estimate'),
      ppv: sum('PPV'), data: sum('Data'), aiaSub: sum('AIA Submits'),
      accRev: sum('Acc Rev'), htp: sum('HTP'), have: rows.length > 0
    };
  }
  // The per-district "widget" view: one row per district (5 total) in place of the single market-
  // wide Close rates + On the floor cards, reusing opsTableHtml() (the same table renderer Daily Ops
  // Review's own tables use) so it inherits the same scrollable, zebra-striped styling for free.
  function ccFloorByDistrict(){
    var ds = DISTRICTS.filter(function(d){ return d.key !== 'control-center'; });
    var header = ['District', 'Total CR', 'PPV CR', 'AIA CR', 'Opportunities', 'Guests in', 'Revenue so far', 'Rev/Guest', 'Upgrade CR', 'Accessory rev', 'HTP sales'];
    var rows = ds.map(function(d){
      var s = districtRtSums(d);
      return [
        d.name,
        ratio(s.opps, s.guests) || '0%',
        ratio(s.ppv, s.guests) || '0%',
        ratio(s.aiaSub, s.guests) || '0%',
        String(s.opps), String(s.guests),
        '$' + s.rev.toFixed(2),
        s.guests > 0 ? '$' + (s.rev / s.guests).toFixed(2) : '$0.00',
        ratio(s.data, s.guests) || '0%',
        '$' + s.accRev.toFixed(2),
        String(s.htp)
      ];
    });
    return opsTableHtml(header, rows);
  }
  function viewCommandCenterOverview(){
    var ds = DISTRICTS.filter(function(d){ return d.key !== 'control-center'; });
    var entries = ds.map(function(d){ return { d: d, c: parseCard(data[districtCardKey(d.key)]) }; });
    // Two separate sums on purpose: sumA/sumT are the real dollars (actual so far, full-month target)
    // shown in the trio below the big number, purely informational. pctA/pctT (implied paced target)
    // are what the big number and bar are actually computed from, so it matches "% to goal" everywhere
    // else in the app instead of a plain actual/full-target ratio.
    var sumA = 0, sumT = 0, have = false, pctA = 0, pctT = 0, haveP = false, days = null;
    entries.forEach(function(x){
      var tot = x.c && totalKpi(x.c);

    if (/^store-/.test(h)) return { name: 'store', slug: h.slice(6), tab: 'stores' };
    if (/^cescorecard-/.test(h)) return { name: 'cescorecard-store', slug: h.slice(12), tab: 'cescorecard' };
    if (NAV.some(function(n){ return n[0] === h; }) || CC_NAV.some(function(n){ return n[0] === h; })) return { name: h, tab: h };
    return { name: 'overview', tab: 'overview' };
  }
  function updated(){
    var m = 0; Object.keys(stamps).forEach(function(k){ if (stamps[k] > m) m = stamps[k]; });
    return m ? new Date(m).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  }
  // The big header now carries the district's own name (same text as its launch-page card) instead
  // of the app's generic "KPIrates" wordmark, which only ever matched Cincinnati's pirate branding.
  function districtDisplayName(key){
    var d = DISTRICTS.filter(function(x){ return x.key === (key || state.district); })[0];
    return d ? d.name : '';
  }
  // The subtitle used to repeat the district name (now redundant with the header above it) - it
  // shows where in the dashboard you are instead: the current section, or the store/employee page
  // you've drilled into.
  function sectionLabel(r){
    if (r.name === 'store') {
      var c = cardFor('s:' + r.slug);
      return c ? nameParts(c.title).name : 'Store';
    }
    if (r.name === 'cescorecard-store') {
      var rows = cescoreRowsFor() || [];
      var full = (rows.filter(function(x){ return cescSlug(x.store) === r.slug; })[0] || {}).store;
      return full ? nameParts(full).name : 'CE Scorecard';
    }
    var n = NAV.filter(function(x){ return x[0] === r.tab; })[0];
    return n ? n[1] : 'Overview';
  }
  function render(){
    document.body.classList.toggle('launch-bg', !state.district);
    document.body.classList.toggle('theme-mock', isATT());
    document.body.classList.toggle('theme-command', state.district === 'control-center');
    if (!state.district) { app.innerHTML = viewLaunch(); return; }
    if (state.district === 'control-center') {
      if (!state.ccUnlocked) { app.innerHTML = ccPasswordView(); return; }
      var ccRoute = route().tab;
      var ccTab = (ccRoute === 'rankings' || ccRoute === 'needs' || ccRoute === 'crash-cart' || ccRoute === 'dailyops' || CC_PLACEHOLDER_TABS.indexOf(ccRoute) !== -1) ? ccRoute : 'overview';
      var ccBody = ccTab === 'rankings' ? viewCommandCenterRankings() : ccTab === 'needs' ? viewCommandCenterNeeds() :
        ccTab === 'crash-cart' ? viewCommandCenterCrashCart() : ccTab === 'dailyops' ? viewCommandCenterDailyOps() :
        CC_PLACEHOLDER_TABS.indexOf(ccTab) !== -1 ? viewCommandCenterPlaceholder(ccTab) : viewCommandCenterOverview();
      app.innerHTML = '<div class="wrap">' + ccHead() + '<main>' + ccBody + '</main></div>' + ccNav(ccTab);
      return;
    }
    var r = route(), body;
    if (state.district === 'cincinnati' && state.gate !== 'ok' && !data.district) body = gateView();
    else if (LIVE_WIRED[state.district] && !data[dkey('district')]) {
      if (errors[dkey('district')] && !districtLoading[state.district]) body = gateView();
      else { body = skeleton(); ensureDistrictLoaded(state.district); }
    }
    else if ((r.name === 'cescorecard' || r.name === 'cescorecard-store') && state.district !== 'cincinnati') body = viewOverview();
    else if (r.name === 'overview') body = viewOverview();
    else if (r.name === 'stores') body = viewStores();
    else if (r.name === 'store') body = viewStore(r.slug);
    else if (r.name === 'rankings') body = viewRankings();
    else if (r.name === 'cescorecard') body = viewCEScorecard();
    else if (r.name === 'cescorecard-store') body = viewCEScorecardStore(r.slug);
    else if (r.name === 'dailyops') body = viewDailyOps();
    else body = viewNeeds();
    var u = isMock() ? '' : updated();
    app.innerHTML =
      '<header class="top"><div class="wrap"><div class="top-l"><div class="brand"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true">' + (state.district === 'kpod-goats' ? GOAT : isATT() ? GLOBE : SKULL) + '</svg>' + esc(districtDisplayName()) + '</div><div class="sub">' + esc(sectionLabel(r)) + (isMock() ? ' · Preview build' : '') + '</div>' + (state.cameFrom === 'control-center' ? '<button type="button" class="switch-district" data-act="back-to-cc">← Command Center</button>' : '<button type="button" class="switch-district" data-act="switch-district">← Best Team In Wireless</button>') + '</div>' +
      '<div class="tools">' + (isMock() ? '' : ((u ? '<span>Updated ' + esc(u) + '</span>' : '') + '<button class="icon-btn' + (state.refreshing ? ' spin' : '') + '" type="button" data-act="refresh" aria-label="Refresh numbers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>')) + '</div></div></header>' +
      '<main class="wrap">' + body + '</main>' +
      '<nav class="nav" aria-label="Sections"><div class="nav-in">' + NAV.filter(function(n){
        return n[0] !== 'cescorecard' || state.district === 'cincinnati';
      }).map(function(n){
        return '<a href="#' + n[0] + '"' + (r.tab === n[0] ? ' aria-current="page"' : '') + '>' + (isATT() ? ICON_STD : ICON)[n[0]] + '<span>' + n[1] + '</span></a>';
      }).join('') +
      '<a href="https://alliance.myshiftlab.app" target="_blank" rel="noopener noreferrer">' + ICON_SHIFT + '<span>Shiftlabs</span></a>' +
      '<a href="' + CALC_URL + '" target="commission-calc" rel="noopener noreferrer">' + ICON_CALC + '<span>Commission Calculator</span></a></div></nav>';
  }
  var pending = 0;
  function schedule(){ if (pending) return; pending = setTimeout(function(){ pending = 0; render(); }, 60); }

  /* ---------- live data: each sheet's own public "visualization" endpoint, no connector/sign-in ----
     This build (kpirates-live.html, deployed on Netlify) reads straight from Google's own gviz/tq
     endpoint for each tab, loaded as JSONP (a plain <script> tag with a callback), NOT a fetch() call.
     A fetch() to docs.google.com from a page hosted on a different origin (your Netlify domain) runs
     straight into the browser's CORS policy, since that endpoint doesn't send back the header a fetch
     needs - that's almost certainly what "not pulling all data" was: some or all tabs silently failing
     that CORS check. A <script src="..."> tag is never subject to CORS (that's the whole JSONP trick),
     so this works the same way from any domain once the spreadsheet is set to "Anyone with the link
     can view" (or published to the web). No Google Cloud service account, no server of any kind. The
     in-Claude artifact version of this same app instead reads through Claude's own Google Sheets
     connector (window.claude.use('mcp')), which doesn't exist here. */
  function shape(rows, spec){
    rows = rows.slice(0, spec.rows).map(function(r){
      r = r.slice(0, spec.cols);
      while (r.length && String(r[r.length - 1]).trim() === '') r.pop();
      return r;
    });
    while (rows.length && !rows[rows.length - 1].length) rows.pop();
    return rows;
  }
  // Reads one sheet tab through the site's own Netlify Function (netlify/functions/sheet.js)
  // instead of talking to Google directly. That function does the actual gviz fetch server-side and
  // caches the result briefly, so every visitor's browser shares one cached copy per sheet instead
  // of each one hitting Google independently - with 100+ people on the app at once, that's the
  // difference between Google seeing a handful of requests a minute and seeing hundreds. Being
  // same-origin also means this is a plain fetch() now, no JSONP script-tag dance needed for CORS.
  // (This file therefore needs to be served BY Netlify - with the function deployed alongside it -
  // to show real data; opening it as a bare local file has nothing to answer these calls.)
  function fetchSheetRows(spreadsheetId, sheetName){
    var url = '/.netlify/functions/sheet?id=' + encodeURIComponent(spreadsheetId) + '&sheet=' + encodeURIComponent(sheetName);
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 15000) : null;
    return fetch(url, ctrl ? { signal: ctrl.signal } : {})
      .then(function(res){
        if (timer) clearTimeout(timer);
        if (!res.ok) throw new Error('sheet fetch failed (' + res.status + '): ' + sheetName);
        return res.json();
      })
      .then(function(json){ return (json && json.rows) || []; })
      .catch(function(e){ if (timer) clearTimeout(timer); throw e; });
  }
  var loadedAt = 0, polling = false;
  // Lazily fetches every Daily Ops Review tab as a one-shot batch, the first time viewDailyOps() (or
  // the Command Center's own Daily Ops Review view) renders, and again on manual refresh. Results
  // land in the same data/stamps/errors objects as everything else, keyed 'dor:<tab key>', so
  // opsTable() reads them exactly like any other live-wired section once they arrive.
  var opsLoading = false, opsLoaded = false, opsLoadedAt = 0;
  // OPS_STALE_MS matches the Netlify Function's own cache window (see netlify/functions/sheet.js) -
  // re-asking within that window costs nothing extra (the function serves it from its own cache
  // instead of hitting Google again), so it's safe to treat the client-side copy as due for a
  // refresh on roughly the same cadence, rather than only ever refetching once per browser session.
  var OPS_STALE_MS = 90 * 1000;
  function ensureOpsLoaded(force){
    if (opsLoading) return;
    // Treat a non-forced call as satisfied only while the last load is still within the stale
    // window; once it ages past that, fall through and refetch even without an explicit force -
    // this is what makes navigating back into Daily Ops Review pick up a just-arrived email's data
    // without requiring a full page reload.
    if (opsLoaded && !force && (Date.now() - opsLoadedAt) < OPS_STALE_MS) return;
    opsLoading = true;
    Promise.all(Object.keys(DOR_SRC).map(function(key){
      var spec = DOR_SRC[key];
      return fetchSheetRows(spec.sid, spec.tab)
        .then(function(rows){ data[key] = shape(rows, spec); stamps[key] = Date.now(); delete errors[key]; })
        .catch(function(e){ errors[key] = e || true; });
    })).then(function(){ opsLoading = false; opsLoaded = true; opsLoadedAt = Date.now(); schedule(); });
  }
  async function connect(){
    if (!data.district) { state.gate = 'loading'; render(); }
    else { state.refreshing = true; render(); }

    await Promise.all(Object.keys(SRC).map(function(key){
      var spec = SRC[key];
      return fetchSheetRows(spec.sid || SID, spec.tab)
        .then(function(rows){ data[key] = shape(rows, spec); stamps[key] = Date.now(); delete errors[key]; })
        .catch(function(e){ errors[key] = e || true; });
    }));
    if (LIVE_WIRED[state.district]) await ensureDistrictLoaded(state.district, true);
    if (route().name === 'dailyops') ensureOpsLoaded(true);

    loadedAt = Date.now();
    state.refreshing = false;
    state.gate = data.district ? 'ok' : (Object.keys(errors).length ? 'unavailable' : (state.gate === 'loading' ? 'error' : state.gate));
    if (!polling) { polling = true; setInterval(connect, 300000); }   // re-poll every 5 minutes
    render();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function(e){
    // In-page section links (nav tabs, store rows, "All stores" back links, CE Scorecard rows) are
    // plain <a href="#...">. Normal browsers navigate those via default anchor behavior and the
    // hashchange listener below re-renders. Some sandboxed embeds (e.g. an artifact preview iframe)
    // swallow that default navigation entirely, so clicking does nothing. Handle it ourselves instead
    // of relying on it: update the hash and re-render directly, every time, regardless of environment.
    var hashLink = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (hashLink) {
      e.preventDefault();
      var h = hashLink.getAttribute('href').slice(1);
      try { location.hash = h; } catch (x) {}
      window.scrollTo(0, 0);
      render();
      return;
    }
    var t = e.target.closest ? e.target.closest('[data-act],[data-tier],[data-ccops],[data-ccopscat],[data-ccfloor]') : null;
    if (!t) return;
    if (t.getAttribute('data-tier')) {
      state.tier = parseInt(t.getAttribute('data-tier'), 10);
      try { localStorage.setItem('kpirates-tier', String(state.tier)); } catch (x) {}
      render(); return;
    }
    if (t.getAttribute('data-ccops')) {
      state.ccOpsDistrict = t.getAttribute('data-ccops');
      state.ccOpsTableDist = {};   // switching the overall scope re-syncs every table to it
      render(); return;
    }
    if (t.getAttribute('data-ccopscat')) {
      state.ccOpsCat = t.getAttribute('data-ccopscat');
      render(); return;
    }
    if (t.getAttribute('data-ccfloor')) {
      state.ccFloorView = t.getAttribute('data-ccfloor');
      render(); return;
    }
    var act = t.getAttribute('data-act');
    if (act === 'retry' || act === 'refresh') {
      // A retry while looking at a live-wired district only needs to re-fetch THAT district's own
      // sheets, not every other district's too - keeps a retry fast and doesn't reintroduce the
      // big-batch request volume this lazy-load split was meant to avoid.
      if (LIVE_WIRED[state.district]) { ensureDistrictLoaded(state.district, true); render(); }
      else connect();
    }
    if (act === 'toggle-emp') {
      var nm = t.getAttribute('data-emp');
      state.cescOpen[nm] = !state.cescOpen[nm];
      render();
    }
    if (act === 'pick-district') {
      // Always land on Overview when boarding a district: a store/employee slug in the hash
      // belongs to whichever district was previously selected, and won't resolve against this
      // one's roster (different districts never share a store slug).
      // If this click came from the Command Center's own district cards, remember that so the
      // district's header can offer a way back there specifically, instead of all the way out
      // to the launch picker.
      state.cameFrom = (state.district === 'control-center') ? 'control-center' : null;
      state.district = t.getAttribute('data-district');
      location.hash = 'overview';
      render();
    }
    if (act === 'ccops-back') { state.ccOpsCat = null; render(); }
    if (act === 'switch-district') { state.district = null; state.cameFrom = null; render(); }
    if (act === 'back-to-cc') { state.district = 'control-center'; location.hash = 'overview'; render(); }
  });
  document.addEventListener('change', function(e){
    var sel = e.target.closest ? e.target.closest('[data-ccops-table-dist]') : null;
    if (!sel) return;
    state.ccOpsTableDist[sel.getAttribute('data-ccops-table-dist')] = sel.value;
    render();
  });
  window.addEventListener('hashchange', function(){ window.scrollTo(0, 0); render(); });
  document.addEventListener('submit', function(e){
    var f = e.target;
    if (!f || f.getAttribute('data-act') !== 'cc-unlock-form') return;
    e.preventDefault();
    var input = f.querySelector('#cc-pw');
    var val = input ? input.value : '';
    if (val === CC_PASSWORD) {
      state.ccUnlocked = true;
      state.ccPwError = false;
      try { sessionStorage.setItem('ccUnlocked', '1'); } catch (err) {}
    } else {
      state.ccPwError = true;
    }
    render();
    if (state.ccUnlocked === false) {
      var retry = document.getElementById('cc-pw');
      if (retry) retry.focus();
    }
  });

  render();
  connect();
  setInterval(connect, 300000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && Date.now() - loadedAt > 60000) connect(); });
})();
</script>
</body>
</html>
